<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pharmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Safe Area Background for Maskable Icons -->
  <rect width="512" height="512" fill="#0f172a" />
  
  <!-- Rounded Emerald/Teal App Emblem -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#pharmGrad)" />
  
  <!-- Inner Ring Accent -->
  <rect x="48" y="48" width="416" height="416" rx="84" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Pharmacy Medical Cross with Shadow -->
  <g fill="url(#crossGrad)" filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="216" y="112" width="80" height="288" rx="20" />
    <!-- Horizontal Bar -->
    <rect x="112" y="216" width="288" height="80" rx="20" />
  </g>

  <!-- ECG Pulse / Heartbeat Line Wave through center -->
  <path d="M 136 256 L 190 256 L 220 180 L 256 332 L 292 200 L 322 256 L 376 256" fill="none" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="8" fill="#047857" />
</svg>
